# On the server this lives in /srv/pharmalens (next to data/ and .env).
services:
  pharmalens:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
    image: pharmalens:latest
    container_name: pharmalens
    restart: unless-stopped
    env_file: .env
    environment:
      # 2 GB VM shared with other projects: keep DuckDB small, spill to disk
      PHARMALENS_DUCKDB_MEMORY: 600MB
      # admin + alert endpoints only for the Tailscale logins in PHARMALENS_OWNERS (.env); fail closed if missing
      PHARMALENS_REQUIRE_OWNER: "1"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - /srv/backups:/srv/backups:ro     # health_watch checks the nightly backup ran
    # reachable only from the VM itself / the reverse proxy, never directly from the internet
    ports:
      - "127.0.0.1:8010:8010"
    mem_limit: 1400m
    # public resolvers: the host's resolver (Azure DNS + Tailscale MagicDNS via systemd-resolved) intermittently times
    # out or answers empty for gov.in hosts (cdscoonline.gov.in), failing the CDSCO feeds; the app needs no tailnet names
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/v1/healthz', timeout=10)"]
      interval: 60s
      timeout: 15s
      retries: 3
