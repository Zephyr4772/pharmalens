# On the server this lives in /srv/pharmalens (next to data/ and .env).
services:
  pharmalens:
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
    image: pharmalens:latest
    container_name: pharmalens
    restart: unless-stopped
    env_file: .env
    environment:
      # 2 GB VM shared with other projects: keep DuckDB small, spill to disk
      PHARMALENS_DUCKDB_MEMORY: 600MB
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    # reachable only from the VM itself / the reverse proxy, never directly from the internet
    ports:
      - "127.0.0.1:8010:8010"
    mem_limit: 1400m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/v1/healthz', timeout=10)"]
      interval: 60s
      timeout: 15s
      retries: 3
